<!DOCTYPE html>
<html>
<head>
<title>Login - SahyadriFest</title>
<style>
body{
background:linear-gradient(135deg,#ff416c,#ff4b2b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Poppins;
}

.box{
background:white;
padding:40px;
border-radius:20px;
width:350px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

input{
width:100%;
padding:10px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:30px;
background:#ff416c;
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
<h2>Login</h2>
<input type="text" placeholder="Username">
<input type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<script>
function login(){
localStorage.setItem("loggedIn",true);
window.location.href="index.html";
}
</script>

</body>
</html>
