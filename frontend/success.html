<!DOCTYPE html>
<html>
<head>
<title>Booking Successful</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body{
  background:linear-gradient(135deg,#ff416c,#ff4b2b);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
  font-family:'Poppins',sans-serif;
  text-align:center;
  margin:0;
  animation:fadeIn 1s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

.box{
  animation: glow 2s infinite alternate;
}

@keyframes glow{
  from{box-shadow:0 0 20px #fff;}
  to{box-shadow:0 0 40px #ffdd00;}
}

button{
  margin-top:20px;
  padding:10px 25px;
  border:none;
  border-radius:30px;
  background:white;
  color:#ff416c;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.1);
}
</style>
</head>

<body>

<div class="box">
  <h1 id="successTitle">Booking Successful!</h1>
  <p>See you at the fest! Let the celebration begin</p>

  <br>

  <img id="qr" width="150">

  <br>

  <button onclick="downloadTicket()">Download Ticket PDF</button>
  <button onclick="goHome()">Back to Home</button>
</div>

<script>
// Get ticket ID from localStorage
var ticketID = localStorage.getItem("ticketID");
var eventName = localStorage.getItem("selectedEvent");

// If ticketID exists, update heading and QR
if(ticketID){
  document.getElementById("successTitle").innerText =
  "Booking Successful! Ticket ID: " + ticketID;

  document.getElementById("qr").src =
  "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" 
  + encodeURIComponent(ticketID);
}

// Confetti effect
confetti({
  particleCount: 150,
  spread: 100,
  origin: { y: 0.6 }
});

// Download demo
function downloadTicket(){
  alert("PDF Downloaded (Demo)");
}

// Go Home
function goHome(){
  window.location.href="index.html";
}
</script>

</body>
</html>
