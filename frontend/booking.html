<!DOCTYPE html>
<html>
<head>
<title>Book Ticket - Sahyadri Fest 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
body{
  font-family:'Poppins',sans-serif;
  background: url('images/bg.jpg') no-repeat center center fixed;
  background-size: cover;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
  color:white;
}
.form-box{
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(10px);
  padding:40px;
  border-radius:20px;
  width:400px;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}
h2{text-align:center;margin-bottom:20px;color:#ff4b2b;}
input, select{width:100%;padding:10px;margin:8px 0;border-radius:10px;border:none;outline:none;font-size:14px;}
.seat-grid{display:grid;grid-template-columns:repeat(5,50px);gap:10px;justify-content:center;margin:15px 0;}
.seat{background:#ff416c;padding:10px;border-radius:5px;text-align:center;cursor:pointer;color:white;transition:0.3s;}
.seat:hover{transform:scale(1.1);}
.seat.disabled{background:#555;cursor:not-allowed;}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:30px;
  background:linear-gradient(90deg,#36d1dc,#5b86e5);
  color:white;
  font-weight:500;
  cursor:pointer;
  transition:0.3s;
  margin-top:15px;
}
button:hover{transform:scale(1.05);}
.confirmation-box{
  background: rgba(0,0,0,0.8);
  padding:20px;
  border-radius:15px;
  margin-top:15px;
}
</style>
</head>
<body>

<div class="form-box">
  <h2 id="eventTitle">Booking</h2>

  <input type="text" id="name" placeholder="Full Name" required>
  <input type="email" id="email" placeholder="Email Address" required>
  <input type="text" id="usn" placeholder="USN / Student ID" required>

  <select id="year">
    <option>Select Year</option>
    <option>1st Year</option>
    <option>2nd Year</option>
    <option>3rd Year</option>
    <option>4th Year</option>
  </select>

  <select id="department">
    <option>Choose Department</option>
    <option>CSE</option>
    <option>ISE</option>
    <option>ECE</option>
    <option>AIML</option>
    <option>MECH/RA</option>
  </select>

  <h3 style="text-align:center;">Select Seat</h3>
  <div class="seat-grid" id="seatContainer"></div>

  <div class="confirmation-box" id="confirmationBox" style="display:none;">
    <h3>Booking Summary</h3>
    <p id="summaryText"></p>
    <img id="qrPreview" width="120" style="margin-top:10px;">
  </div>

  <button id="paymentBtn">Proceed to Payment</button>
</div>

<script>
// ✅ Get selected event safely
const selectedEvent = localStorage.getItem("selectedEvent") || "Unknown Event";
document.getElementById("eventTitle").innerText = "Booking for " + selectedEvent;

// Clear old seats when page loads (important fix)
localStorage.removeItem("seats");

const seatContainer = document.getElementById("seatContainer");
let bookedSeats = [];
let selectedSeats = [];

// ✅ Fetch already booked seats
async function loadBookedSeats() {
  try {
    const response = await fetch(`http://localhost:5000/booked-seats?event=${encodeURIComponent(selectedEvent)}`);
    const data = await response.json();
    bookedSeats = data.booked || [];
    createSeats();
  } catch(err) {
    console.log("Failed to fetch booked seats:", err);
    createSeats();
  }
}

function createSeats() {
  seatContainer.innerHTML = "";

  for(let i=1;i<=20;i++){
    const seat = document.createElement("div");
    seat.classList.add("seat");
    seat.innerText = i;

    if(bookedSeats.includes(i.toString())){
      seat.classList.add("disabled");
    } else {
      seat.onclick = function(){
        const seatNumber = seat.innerText;

        if(selectedSeats.includes(seatNumber)){
          selectedSeats = selectedSeats.filter(s => s !== seatNumber);
          seat.style.background="#ff416c";
        } else {
          selectedSeats.push(seatNumber);
          seat.style.background="green";
        }

        localStorage.setItem("seats", JSON.stringify(selectedSeats));
        updateConfirmation();
      };
    }

    seatContainer.appendChild(seat);
  }
}

// ✅ Update confirmation box
function updateConfirmation(){
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const usn = document.getElementById("usn").value.trim();
  const year = document.getElementById("year").value;
  const dept = document.getElementById("department").value;
  const seats = JSON.parse(localStorage.getItem("seats") || "[]");

  if(name && email && usn && year!=="Select Year" && dept!=="Choose Department" && seats.length > 0){

    document.getElementById("confirmationBox").style.display="block";

    document.getElementById("summaryText").innerText = `
Name: ${name}
Email: ${email}
USN: ${usn}
Year: ${year}
Dept: ${dept}
Seats: ${seats.join(", ")}
Event: ${selectedEvent}
    `;

    document.getElementById("qrPreview").src =
      "https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=" +
      encodeURIComponent(`Event:${selectedEvent} | Seats:${seats.join(",")} | Name:${name}`);

  } else {
    document.getElementById("confirmationBox").style.display="none";
  }
}

// Listen for input changes
["name","email","usn","year","department"].forEach(id=>{
  document.getElementById(id).addEventListener("input", updateConfirmation);
  document.getElementById(id).addEventListener("change", updateConfirmation);
});

// Load booked seats
loadBookedSeats();

// ✅ Payment button
document.getElementById("paymentBtn").addEventListener("click", function() {

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const usn = document.getElementById("usn").value.trim();
  const year = document.getElementById("year").value;
  const dept = document.getElementById("department").value;
  const seats = JSON.parse(localStorage.getItem("seats") || "[]");

  if(!name || !email || !usn || year==="Select Year" || dept==="Choose Department" || seats.length === 0){
      alert("Please fill all fields and select at least one seat!");
      return;
  }

  fetch("http://localhost:5000/book", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      name: name,
      email: email,
      usn: usn,
      year: year,
      dept: dept,
      event: selectedEvent,
      seats: seats
    })
  })
  .then(res => res.json())
  .then(data => {

    // ✅ Store everything BEFORE redirect
    localStorage.setItem("ticketID", data.ticket_id);
    localStorage.setItem("selectedEvent", selectedEvent);
    localStorage.setItem("seats", JSON.stringify(seats));
    localStorage.setItem("name", name);
    localStorage.setItem("email", email);
    localStorage.setItem("usn", usn);
    localStorage.setItem("year", year);
    localStorage.setItem("dept", dept);

    alert("Booking Successful!");
    window.location.href = "payment.html";
  })
  .catch(err => {
      alert("Booking failed!");
      console.log(err);
  });
});
</script>
</body>
</html>
