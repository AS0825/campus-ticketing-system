<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
  background:#111827;
  color:white;
  font-family:'Poppins',sans-serif;
  padding:40px;
}

h1{
  margin-bottom:30px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:20px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,0.4);
}

input{
  padding:10px;
  border-radius:10px;
  border:none;
  margin-top:20px;
  width:250px;
}

button{
  padding:10px 20px;
  border:none;
  border-radius:20px;
  margin-left:10px;
  cursor:pointer;
  background:#36d1dc;
  color:white;
  font-weight:500;
}

button:hover{
  background:#5b86e5;
}
</style>
</head>

<body>

<h1>Admin Dashboard</h1>

<div class="card">
  <h3>Total Bookings</h3>
  <p id="totalBookings">Loading...</p>
</div>

<div class="card">
  <h3>Available Seats</h3>
  <p id="availableSeats">Loading...</p>
</div>

<h3>Validate Ticket</h3>
<input type="text" id="ticketInput" placeholder="Enter Ticket Code">
<button onclick="validateTicket()">Validate</button>

<script>
// Load booking stats from backend
async function loadStats(){
  const response = await fetch("http://localhost:5000/stats");
  const data = await response.json();

  document.getElementById("totalBookings").innerText = data.total;
  document.getElementById("availableSeats").innerText = 200 - data.total; 
  // 200 = total seats (change if needed)
}

loadStats();

// Validate ticket
async function validateTicket(){
  let code = document.getElementById("ticketInput").value;

  if(!code){
    alert("Enter ticket code!");
    return;
  }

  const response = await fetch("http://localhost:5000/validate/" + code);
  const data = await response.json();

  alert(data.status);
}
</script>

</body>
</html>
