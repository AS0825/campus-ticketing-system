<!DOCTYPE html>
<html>
<head>
<title>Payment</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
body{
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.payment-box{
  background: rgba(255,255,255,0.9);
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  width: 400px;
}
button{
  padding: 12px 25px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(90deg,#36d1dc,#5b86e5);
  color: white;
  cursor: pointer;
  font-weight: 600;
  margin-top: 20px;
}
</style>
</head>
<body>

<div class="payment-box">
  <h2>Payment Page</h2>
  <p>Name: <span id="userName"></span></p>
  <p>Email: <span id="userEmail"></span></p>
  <p>Seat: <span id="userSeat"></span></p>

  <button onclick="completePayment()">Pay Now</button>
</div>

<script>
document.getElementById("userName").innerText = localStorage.getItem("name") || "";
document.getElementById("userEmail").innerText = localStorage.getItem("email") || "";
document.getElementById("userSeat").innerText = localStorage.getItem("seat") || "";

function completePayment(){
    alert("Payment Successful! 🎉");
    // redirect to success page
    window.location.href = "success.html";
}
</script>

</body>
</html>
