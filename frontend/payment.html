<!DOCTYPE html>
<html>
<head>
<title>Payment - Sahyadri Fest 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
  color:white;
}
.payment-box{
  background:white;
  color:black;
  padding:40px;
  border-radius:20px;
  width:420px;
  box-shadow:0 15px 35px rgba(0,0,0,0.3);
  text-align:center;
}
h2{color:#2a5298;margin-bottom:20px;}
input{
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
  border:1px solid #ccc;
}
.total{
  font-size:18px;
  font-weight:600;
  margin:10px 0;
}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:30px;
  background:linear-gradient(90deg,#36d1dc,#5b86e5);
  color:white;
  font-weight:600;
  cursor:pointer;
  margin-top:15px;
}
button:hover{opacity:0.9;}
#qrSection{
  display:none;
  margin-top:20px;
}
</style>
</head>
<body>

<div class="payment-box">
  <h2>Complete Your Payment</h2>

  <p id="bookingInfo"></p>

  <div class="total" id="totalCost"></div>

  <div id="qrSection">
    <h4>Scan to Pay</h4>
    <img id="paymentQR" width="180">
  </div>

  <input type="tel" id="mobile" placeholder="Enter Mobile Number" required>

  <button id="payNow">Pay Now</button>
</div>

<script>

// ✅ Get stored data
const seats = JSON.parse(localStorage.getItem("seats") || "[]");
const event = localStorage.getItem("selectedEvent") || "Not Selected";
const name = localStorage.getItem("name") || "Guest";

const pricePerSeat = 200;
const total = seats.length * pricePerSeat;

// ✅ Show booking info
document.getElementById("bookingInfo").innerHTML = `
Event: <b>${event}</b><br>
Seats: <b>${seats.join(", ")}</b><br>
Name: <b>${name}</b>
`;

document.getElementById("totalCost").innerText =
"Total Amount: Rs" + total;


// ✅ Pay Now Button
document.getElementById("payNow").addEventListener("click", function(){

    const mobile = document.getElementById("mobile").value.trim();

    if(seats.length === 0){
        alert("No seats selected!");
        return;
    }

    if(mobile.length < 10){
        alert("Enter valid mobile number!");
        return;
    }

    // 🔥 Generate QR
    const qrData = `Event:${event} | Seats:${seats.join(",")} | Name:${name} | Amount:${total}`;

    document.getElementById("paymentQR").src =
        "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data="
        + encodeURIComponent(qrData);

    document.getElementById("qrSection").style.display = "block";

    // ⏳ Redirect after 4 seconds
    setTimeout(() => {
        window.location.href = "success.html";
    }, 4000);
});

</script>

</body>
</html>
